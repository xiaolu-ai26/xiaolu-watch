name: WatchMemory
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  WatchMemoryCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.9'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: '0.1.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: '$(WATCH_MEMORY_DEVELOPMENT_TEAM)'
targets:
  WatchMemoryPhone:
    type: application
    platform: iOS
    sources:
      - path: PhoneApp
    dependencies:
      - package: WatchMemoryCore
      - target: WatchMemoryWatch
        embed: true
    info:
      path: PhoneApp/Info.plist
      properties:
        CFBundleDisplayName: 小鹿录音
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: 扫描你自己的处理电脑提供的连接二维码。
        NSLocalNetworkUsageDescription: 将手表录音发送到你设置的家庭处理电脑。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XIAOLU_WATCH_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  WatchMemoryWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: PhoneApp/KeychainConfiguration.swift
      - path: PhoneApp/BackgroundUploadScheduling.swift
    dependencies:
      - package: WatchMemoryCore
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: 小鹿录音
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(XIAOLU_WATCH_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: true
        NSMicrophoneUsageDescription: 持续记录你开启的对话，并由手表直接上传到你选择的处理电脑。
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XIAOLU_WATCH_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
schemes:
  WatchMemoryPhone:
    build:
      targets:
        WatchMemoryPhone: all
    run:
      config: Debug
  WatchMemoryWatch:
    build:
      targets:
        WatchMemoryWatch: all
    run:
      config: Debug
